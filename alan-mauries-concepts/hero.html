html,body{margin:0;height:100%}body{background:#141210;display:flex;align-items:center;min-height:100vh}body>div{flex:1}
a{color:#f5ecd7}a:hover{color:#f6b732}
@keyframes brushA{0%{stroke-dashoffset:1.05;animation-timing-function:cubic-bezier(.6,0,.9,.5)}14%{stroke-dashoffset:.93;animation-timing-function:cubic-bezier(.3,.35,.6,1)}70%{stroke-dashoffset:.13;animation-timing-function:cubic-bezier(.15,.55,.35,1)}100%{stroke-dashoffset:0}}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.p{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 2;stroke-dashoffset:1.05;animation-fill-mode:both}
@keyframes fillIn{from{opacity:0}to{opacity:1}}
.finish{opacity:0;animation:fillIn .5s ease-in-out 5.0s both}
.a{animation-name:brushA}
.b{animation-name:brushB}
.w{fill:none;stroke:#f5ecd7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 2;stroke-dashoffset:1.05;animation-name:write;animation-fill-mode:both}
.shade{opacity:0;animation:fadeIn 1s ease-out 2.2s both}
.rise{animation-name:riseIn;animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.7,.2,1);animation-fill-mode:both}
.replay:hover{background:rgba(26,23,18,.85) !important}
.cta:hover{border-color:#f6b732 !important;color:#f6b732 !important}
@media (prefers-reduced-motion: reduce){.p,.w{animation:none;stroke-dashoffset:0}.shade{animation:none;opacity:1}.rise{animation:none}}
</style>
